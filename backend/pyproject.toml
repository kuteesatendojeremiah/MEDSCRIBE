[project]
name = "mediscribe-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.111.0",
  "uvicorn==0.30.1",
  "pydantic==2.12.5",
  "pydantic-settings==2.3.0",
  "python-docx==1.2.0",
  "jsonschema==4.26.0",
  "reportlab>=4.0",
]

[project.optional-dependencies]
local = ["faster-whisper==1.2.1", "av>=14,<19", "numpy"]
dev = ["pytest==8.3.3", "httpx==0.27.0", "ruff==0.6.9", "black==24.10.0", "psutil"]

[tool.pytest.ini_options]
testpaths = ["tests", "../tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
